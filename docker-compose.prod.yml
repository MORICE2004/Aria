# Production Docker Compose for ARIA Persistent Services on DigitalOcean
# Starts PostgreSQL (pgvector), Redis, FastAPI backend + workers, WhatsApp Observer, and WhatsApp Sender.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything is configured for automated restart on failure and reboot (restart: unless-stopped).

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE: PostgreSQL 16 + pgvector
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aria_secure_production_password}
      POSTGRES_DB: ${POSTGRES_DB:-aria}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aria}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------------------------
  # 2. CACHE & QUEUE: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aria-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - aria_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------------------------
  # 3. CORE BACKEND ENGINE & WORKERS: FastAPI, Playwright, Proactive, Queue Drain
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: aria-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aria}:${POSTGRES_PASSWORD:-aria_secure_production_password}@postgres:5432/${POSTGRES_DB:-aria}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ARIA_PASSWORD: ${ARIA_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.1}
      OPENCLAW_INGEST_SECRET: ${OPENCLAW_INGEST_SECRET}
      WHATSAPP_WORKER_ENABLED: "true"
      WHATSAPP_WORKER_POLL_SECONDS: 2.0
      PROACTIVE_ENABLED: "true"
      PROACTIVE_INTERVAL_SECONDS: 300.0
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. WHATSAPP OBSERVER: Inbound WebSocket listener (read-only)
  # ----------------------------------------------------------------------------
  whatsapp-observer:
    build:
      context: .
      dockerfile: Dockerfile.wa-bridge
    container_name: aria-wa-observer
    restart: unless-stopped
    command: ["node", "index.js"]
    environment:
      ARIA_API_URL: http://api:8000/whatsapp
      ARIA_INGEST_SECRET: ${OPENCLAW_INGEST_SECRET}
    volumes:
      - aria_wa_auth:/app/auth
      - aria_wa_spool:/app/spool
    depends_on:
      - api

  # ----------------------------------------------------------------------------
  # 5. WHATSAPP SENDER: Dedicated outbound delivery process
  # ----------------------------------------------------------------------------
  whatsapp-sender:
    build:
      context: .
      dockerfile: Dockerfile.wa-bridge
    container_name: aria-wa-sender
    restart: unless-stopped
    command: ["node", "sender.js"]
    environment:
      ARIA_API_URL: http://api:8000/whatsapp
      ARIA_INGEST_SECRET: ${OPENCLAW_INGEST_SECRET}
    volumes:
      - aria_wa_sender:/app/auth-sender
    depends_on:
      - api

# ------------------------------------------------------------------------------
# PERSISTENT VOLUMES (Survive container restarts and host reboots)
# ------------------------------------------------------------------------------
volumes:
  aria_pgdata:
    driver: local
  aria_redisdata:
    driver: local
  aria_wa_auth:
    driver: local
  aria_wa_sender:
    driver: local
  aria_wa_spool:
    driver: local
